name: "Routing: Host subagent launch"
dataset: "subagent_routing.jsonl"
system_prompt: "subagent_routing_prompt.md"
mcp_tools:
  - "tools/launch_specialist.json"
metrics:
  - type: "tool_selection"
  - type: "schema_match"
    strict: true
  - type: "argument_correctness"
  - type: "mcp_use"
  - type: "task_completion"
ontology:
  gates:
    - skill:agent-orchestrator
    - skill:agent-review
    - skill:agent-debug
    - skill:agent-tdd
    - skill:agent-xfn
    - skill:agent-security
mocks:
  - tool: "launch_specialist"
    response:
      launched: true
      note: "Parent reads COMPLETE/BLOCKED from the handover, not the chat summary"
