name: "Routing: Architecture Extraction"
dataset: "architecture_routing.jsonl"
mcp_tools:
  - "tools/read_architecture_yaml.json"
metrics:
  - type: "tool_selection"
    expected: "read_architecture_yaml"
  - type: "schema_match"
    strict: true
  - type: "argument_correctness"
  - type: "task_completion"
  - type: "criteria_judge"
    threshold: 1.0
    criteria:
      - "Response must reflect the tool output"
      - "Response must not invent components absent from tool output"
  - type: "llm_as_judge"
mocks:
  - tool: "read_architecture_yaml"
    response:
      status: "success"
      component: "payment-api"
      containers:
        - "payment-api"
        - "payment-db"
      relationships:
        - "payment-api -> payment-db"
