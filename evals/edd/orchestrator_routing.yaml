name: "Routing: Orchestrator specialist launch"
dataset: "orchestrator_routing.jsonl"
system_prompt: "orchestrator_routing_prompt.md"
mcp_tools:
  - "tools/launch_specialist.json"
metrics:
  - type: "tool_selection"
  - type: "schema_match"
    strict: true
  - type: "argument_correctness"
  - type: "mcp_use"
  - type: "task_completion"
mocks:
  - tool: "launch_specialist"
    response:
      launched: true
      note: "Parent must not implement; specialist owns the phase"
ontology:
  gates:
    - skill:agent-orchestrator
    - skill:agent-review
    - skill:agent-debug
    - skill:agent-tdd
