name: "Routing: Parent skill (skills-only)"
dataset: "subagent_routing.jsonl"
system_prompt: "subagent_routing_skills_only_prompt.md"
mcp_tools:
  - "tools/load_skill.json"
metrics:
  - type: "tool_selection"
  - type: "schema_match"
    strict: true
  - type: "argument_correctness"
  - type: "mcp_use"
  - type: "task_completion"
ontology:
  gates:
    - skill:agent-orchestrator
    - skill:agent-review
    - skill:agent-debug
    - skill:agent-tdd
    - skill:agent-xfn
    - skill:agent-security
    - skill:agent-spec
mocks:
  - tool: "load_skill"
    response:
      loaded: true
      note: "Parent loads SKILL.md in this chat and writes COMPLETE/BLOCKED to the handover"
