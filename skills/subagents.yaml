# Source of truth for which role skills become host subagents (MZW-59).
# Playbooks stay in SKILL.md. This file only classifies runtime.
# generate lists are derived from roles (do not duplicate them here).
version: 1
skillsOnly: false
expandKill: >-
  Freeze this generate list if auto-delegation picks the wrong agent more often
  than today's skill picker. Fix thin handovers before adding roles.
expandKillIndicator: >-
  Promote wrong-specialist misses with wk eval dataset from-trace into
  evals/edd/subagent_routing.jsonl. Freeze generate when that miss rate
  exceeds skill-picker misses in evals/suites/routing-matrix.json.
staySkillPrefixes:
  - lang-
  - framework-
  - profile-
tdd:
  skill: agent-tdd
  gears: same-session
  escapeHatch: agent-adapter
roles:
  agent-orchestrator:
    runtime: parent
  agent-debug:
    runtime: subagent
    bucket: isolation
    readonly: false
  agent-xfn:
    runtime: subagent
    bucket: isolation
    readonly: false
  agent-review:
    runtime: subagent
    bucket: audit
    readonly: true
  agent-security:
    runtime: subagent
    bucket: audit
    readonly: true
  agent-arch-drift:
    runtime: subagent
    bucket: audit
    readonly: true
  agent-spec:
    runtime: subagent
    bucket: sequential
    readonly: false
  agent-tdd:
    runtime: subagent
    bucket: sequential
    readonly: false
  agent-adapter:
    runtime: skill
  agent-grilling:
    runtime: skill
  agent-grill-me:
    runtime: skill
  agent-prd:
    runtime: skill
  agent-user-stories:
    runtime: skill
  agent-api-contract:
    runtime: skill
  agent-adr:
    runtime: skill
  agent-incident:
    runtime: skill
  agent-ui:
    runtime: skill
  agent-copy:
    runtime: skill
  agent-migration:
    runtime: skill
  agent-docs:
    runtime: skill
  agent-prune:
    runtime: skill
  agent-telemetry:
    runtime: skill
  agent-cloudflare-ops:
    runtime: skill
  agent-posthog:
    runtime: skill
  agent-perf-opt:
    runtime: skill
  agent-pre-commit:
    runtime: skill
  agent-release:
    runtime: skill
