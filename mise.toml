# Local observability for EDD closed-loop demos (otelop).
# Install mise: https://mise.jdx.dev/getting-started.html
# Then: mise trust && mise install

[tools]
"github:mashiro/otelop" = "1.2.2"

[tasks.otelop]
description = "Start otelop (OTLP 4317/4318, UI http://127.0.0.1:4319)"
run = "otelop start --http 127.0.0.1:4319 --otlp-grpc 127.0.0.1:4317 --otlp-http 127.0.0.1:4318 --retention 1d --max-size 256MB"

[tasks."otelop:stop"]
description = "Stop background otelop"
run = "otelop stop"

[tasks."otelop:status"]
description = "Show otelop status"
run = "otelop status"

[tasks."edd:emit-spans"]
description = "POST sample kit agent.loop spans to otelop OTLP/HTTP"
run = "node --import tsx/esm scripts/edd-emit-otel-samples.ts"

[tasks."edd:shadow-demo"]
description = "Run shadow eval on example prod turns (sample 100%, deterministic)"
run = """
#!/usr/bin/env bash
set -euo pipefail
set +e
node --import tsx/esm bin/kit.ts eval shadow --infile evals/edd/examples/prod-turns.jsonl --sample 1 --seed 1 --out out/shadow-fails.jsonl
code=$?
set -e
if [[ "$code" -eq 1 ]]; then
  echo "Demo OK: exit 1 means shadow fails were found (see out/shadow-fails.jsonl)."
  exit 0
fi
exit "$code"
"""

[tasks."edd:otel-demo"]
description = "Start otelop, emit sample spans, print closed-loop commands"
run = """
#!/usr/bin/env bash
set -euo pipefail
otelop start --http 127.0.0.1:4319 --otlp-grpc 127.0.0.1:4317 --otlp-http 127.0.0.1:4318 --retention 1d --max-size 256MB
sleep 0.5
node --import tsx/esm scripts/edd-emit-otel-samples.ts
echo
echo "UI:  http://127.0.0.1:4319"
echo "Then: mise run edd:shadow-demo"
echo "      kit eval dataset from-trace --trace evals/edd/examples/prod-trace.json --out out/prod.jsonl"
echo "Stop: mise run otelop:stop"
"""
