name: Agent EDD Suite

on:
  pull_request:
    paths:
      - 'evals/edd/**'
      - 'kit/src/edd/**'
      - 'kit/src/edd_cli.ts'
      - 'bin/kit.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/edd/**'
      - 'kit/src/edd/**'
      - 'kit/src/edd_cli.ts'
      - 'bin/kit.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-evals.yml'

permissions:
  contents: read

jobs:
  evaluate:
    name: EDD CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Run Agent Evaluations (threshold gate)
        id: edd
        env:
          # Optional live provider — defaults to scripted driver when unset
          KIT_EVAL_API_KEY: ${{ secrets.KIT_EVAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIT_EVAL_MODEL: ${{ vars.KIT_EVAL_MODEL || 'scripted' }}
        run: |
          mkdir -p out/reports
          pnpm kit eval ci \
            --suite evals/edd/architecture_routing.yaml \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm kit eval ci \
            --suite evals/edd/kit_knowledge.yaml \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm kit eval ci \
            --suite evals/edd/safety.yaml \
            --model "${KIT_EVAL_MODEL}" \
            --threshold-routing 95 \
            --out out/reports
          pnpm kit eval run --suite evals/edd/architecture_self_correction.yaml --model scripted --out out/reports
          pnpm kit eval run --suite evals/edd/architecture_terminal.yaml --model scripted --out out/reports

      - name: Publish EDD job summary
        if: always()
        run: |
          {
            echo "## Agent EDD Suite"
            echo ""
            echo "Path-filtered gate for EDD harness / suite changes. Green means routing and schema"
            echo "assertions hold at ≥95% routing accuracy on the scripted driver (or the configured"
            echo "\`KIT_EVAL_MODEL\`), plus safety, self-correction, and terminal-fallback suites."
            echo ""
            echo "| Suite | Role |"
            echo "|-------|------|"
            echo "| architecture_routing | Tool selection + schema match (threshold gate) |"
            echo "| kit_knowledge | Kit-knowledge MCP routing (threshold gate) |"
            echo "| safety | Injection + no-tool refusal |"
            echo "| architecture_self_correction | Recovery after a bad first tool call |"
            echo "| architecture_terminal | Graceful stop when tools cannot help |"
            echo ""
            echo "Download the \`edd-eval-reports\` artifact for the raw Markdown/JSON."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f out/reports/edd-report.json ]; then
            pnpm kit eval report --format md --out out/reports --from out/reports/edd-report.json --github-summary
          else
            echo "_No EDD report JSON was produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EDD report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edd-eval-reports
          path: out/reports/
          if-no-files-found: warn
