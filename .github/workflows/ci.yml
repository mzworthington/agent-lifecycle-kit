name: Agent Lifecycle Kit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# C4: Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills & Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:ci

      - name: Kit quality gate
        run: pnpm kit check

      - name: Test MCP Profile Composition
        run: pnpm kit mcp default

      - name: Test kit CLI Executable
        run: pnpm kit metrics

      - name: Publish CI job summary
        if: always()
        run: |
          {
            echo "## Agent Lifecycle Kit CI"
            echo ""
            echo "This job is the merge gate for the kit itself — not a generic lint/test badge."
            echo ""
            echo "| Gate | What a green check means |"
            echo "|------|--------------------------|"
            echo "| actionlint | Workflow YAML is valid and Action-safe |"
            echo "| typecheck / unit tests | TypeScript and Node harness tests pass |"
            echo "| kit check | Skill security scan, layout, IDE rules export, skill-trigger evals, EDD routing ≥95% (architecture + kit-knowledge + safety), context budget |"
            echo "| MCP profile / kit metrics | Default MCP composition resolves; CLI metrics command runs |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f out/reports/unit-test-report.md ]; then
            cat out/reports/unit-test-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No unit test report was produced._" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f out/reports/coverage.lcov ]; then
            echo "## Unit test coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "LCOV written to \`out/reports/coverage.lcov\` (report-only; no gate yet). Summary lines from the test run also appear in the job log under \"coverage report\"." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Pull the all-files summary line from the LCOV end marker context via a tiny node helper
            node -e '
              const fs = require("fs");
              const lcov = fs.readFileSync("out/reports/coverage.lcov", "utf8");
              let lf = 0, lh = 0, fnf = 0, fnh = 0, brf = 0, brh = 0;
              for (const line of lcov.split("\n")) {
                if (line.startsWith("LF:")) lf += Number(line.slice(3));
                else if (line.startsWith("LH:")) lh += Number(line.slice(3));
                else if (line.startsWith("FNF:")) fnf += Number(line.slice(4));
                else if (line.startsWith("FNH:")) fnh += Number(line.slice(4));
                else if (line.startsWith("BRF:")) brf += Number(line.slice(4));
                else if (line.startsWith("BRH:")) brh += Number(line.slice(4));
              }
              const pct = (h, f) => (f === 0 ? 100 : (100 * h) / f);
              console.log(`lines: ${pct(lh, lf).toFixed(2)}% (${lh}/${lf})`);
              console.log(`functions: ${pct(fnh, fnf).toFixed(2)}% (${fnh}/${fnf})`);
              console.log(`branches: ${pct(brh, brf).toFixed(2)}% (${brh}/${brf})`);
            ' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No coverage.lcov was produced._" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f out/reports/edd-report.json ]; then
            pnpm kit eval report --format md --out out/reports --from out/reports/edd-report.json --github-summary
          else
            echo "_No EDD report artifacts were produced (kit check may have failed earlier)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EDD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edd-eval-reports-ci
          path: out/reports/
          if-no-files-found: warn
