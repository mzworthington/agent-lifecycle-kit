name: Agent Lifecycle Kit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# C4: Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills & Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # H1: Type-check TypeScript (annotations are decorative without this)
      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Audit Skill Security & Secrets
        run: ./scripts/scan-skill-security.sh

      - name: Run Evals Schema & Trigger Validation
        run: ./scripts/validate-evals.sh

      - name: Verify Skills Directory Layout
        run: ./scripts/verify-skills-layout.sh

      - name: Verify Multi-IDE Rules Sync
        run: ./scripts/export-ide-rules.sh --check

      - name: Run Live Skill Trigger Evals
        run: ./scripts/run-evals.sh

      - name: Run EDD harness unit tests
        run: pnpm test:edd

      - name: Run EDD CI gate (scripted)
        run: |
          mkdir -p out/reports
          pnpm eval:edd

      - name: Upload EDD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edd-eval-reports-ci
          path: out/reports/
          if-no-files-found: warn

      - name: Test MCP Profile Composition
        run: ./scripts/compose-mcp.sh default

      - name: Test kit CLI Executable
        run: |
          pnpm kit audit
          pnpm kit validate
          pnpm kit eval
          pnpm kit eval run --suite evals/edd/architecture_routing.yaml --model scripted
          pnpm kit eval run --suite evals/edd/kit_knowledge.yaml --model scripted
          pnpm kit metrics
