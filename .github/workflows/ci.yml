name: Agent Lifecycle Kit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# C4: Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills & Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Kit quality gate
        run: pnpm kit check

      - name: Upload EDD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edd-eval-reports-ci
          path: out/reports/
          if-no-files-found: warn

      - name: Test MCP Profile Composition
        run: pnpm kit mcp default

      - name: Test kit CLI Executable
        run: pnpm kit metrics
