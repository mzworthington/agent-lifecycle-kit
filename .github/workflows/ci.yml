name: Agent Lifecycle Kit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# C4: Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills & Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # H1: Type-check TypeScript (annotations are decorative without this)
      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Audit Skill Security & Secrets
        run: |
          chmod +x scripts/scan-skill-security.sh
          ./scripts/scan-skill-security.sh

      - name: Run Evals Schema & Trigger Validation
        run: |
          chmod +x scripts/validate-evals.sh
          ./scripts/validate-evals.sh

      - name: Verify Skills Directory Layout
        run: |
          chmod +x scripts/verify-skills-layout.sh
          ./scripts/verify-skills-layout.sh

      - name: Test MCP Profile Composition
        run: |
          chmod +x scripts/compose-mcp.sh
          ./scripts/compose-mcp.sh default
