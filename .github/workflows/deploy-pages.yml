name: Deploy GitHub Pages Documentation

# Custom domain DNS (apex A/AAAA + www CNAME) is owned by edge-dns:
# https://github.com/mzworthington/edge-dns/blob/main/docs/github-pages-origin.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: https://eval-driven-development.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deploy job summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deploy GitHub Pages"
            echo ""
            echo "Publishes the kit docs site (landing + EDD guides) to GitHub Pages."
            echo "Custom domain DNS is owned by [edge-dns](https://github.com/mzworthington/edge-dns)."
            echo ""
            if [ -n "${PAGE_URL}" ]; then
              echo "- **Deployment URL:** ${PAGE_URL}"
            fi
            echo "- **Canonical site:** https://eval-driven-development.dev"
            echo ""
            echo "A green check means the Pages artifact uploaded and the environment deployment finished."
          } >> "$GITHUB_STEP_SUMMARY"
